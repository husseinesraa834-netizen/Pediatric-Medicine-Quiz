<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediatric Nursing Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <div class="logo">🩺</div>
            <h1>Pediatric Nursing</h1>
            <p class="subtitle">Quiz & Knowledge Challenge</p>
        </header>

        <main id="home-screen" class="screen">
            <div class="welcome-card">
                <h2>Welcome, Nursing Student! 💗</h2>
                <p>
                    Challenge yourself, revise your knowledge
                    and practice your Pediatric Nursing questions.
                </p>
            </div>

            <h3 class="section-title">Choose your quiz mode</h3>

            <div class="mode-cards">

                <button class="mode-card" onclick="startQuiz('mcq')">
                    <div class="mode-icon">📝</div>
                    <h3>Multiple Choice</h3>
                    <p>Practice MCQ questions</p>
                </button>

                <button class="mode-card" onclick="startQuiz('tf')">
                    <div class="mode-icon">✔️</div>
                    <h3>True or False</h3>
                    <p>Test your knowledge</p>
                </button>

                <button class="mode-card" onclick="startQuiz('all')">
                    <div class="mode-icon">📚</div>
                    <h3>All Questions</h3>
                    <p>Practice everything</p>
                </button>

            </div>
        </main>

        <section id="quiz-screen" class="screen hidden">

            <div class="quiz-top">
                <button class="back-btn" onclick="goHome()">← Home</button>
                <div id="score-display">Score: 0</div>
            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div id="question-counter"></div>

            <div class="question-card">
                <h2 id="question-text"></h2>
                <div id="options-container"></div>
                <div id="feedback"></div>
            </div>

            <button id="next-btn" class="hidden" onclick="nextQuestion()">
                Next Question →
            </button>

        </section>

        <section id="result-screen" class="screen hidden">

            <div class="result-card">
                <div class="result-icon">🏆</div>
                <h2>Quiz Completed!</h2>
                <p id="final-score"></p>
                <p id="result-message"></p>

                <button class="main-btn" onclick="goHome()">
                    Try Again
                </button>
            </div>

        </section>

        <footer>
            <p>Made for Pediatric Nursing Students 💗</p>
        </footer>

    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>
                  </html>
